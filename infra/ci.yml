# Reference copy of the GitHub Actions workflow used in the full (private) project.
# It is kept here, outside .github/workflows/, on purpose: this repository is an
# excerpt, so the workflow would fail if GitHub ran it. Lockfiles are not part
# of the excerpt either, which `npm ci` and the cache paths below rely on.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Tests derive their own database from this: pitsburger -> pitsburger_test.
    # It is created and migrated by backend/test/globalSetup.ts.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pitsburger

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  owner-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ownerApp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ownerApp/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b && vite build, so this is the type-check too
      - name: Typecheck and build
        run: npm run build

      # `npm test` is watch mode; `vitest run` runs once and exits
      - name: Tests
        run: npx vitest run

  employee-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employeeApp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: employeeApp/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b && vite build, so this is the type-check too
      - name: Typecheck and build
        run: npm run build

      # `npm test` is watch mode; `vitest run` runs once and exits
      - name: Tests
        run: npx vitest run

  e2e:
    # Only once the unit tests, lint and builds are green.
    needs: [backend, owner-app, employee-app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e

    # e2e/support/env.ts adds "_e2e": pitsburger -> pitsburger_e2e, which
    # support/prepareDb.mjs drops, recreates and migrates on every run.
    # CI=true (set by GitHub) turns on the WebKit projects and one retry.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pitsburger

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            backend/package-lock.json
            ownerApp/package-lock.json
            employeeApp/package-lock.json

      # Playwright's webServer builds and starts all three, so each needs its deps.
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: ownerApp
      - run: npm ci
        working-directory: employeeApp

      # Browsers are tied to the Playwright version, which the lockfile pins.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # The cache holds the browsers only, not the Linux libraries they need.
      - name: Install browser system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: E2E tests
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
